services:
  api:
    build: ./backend
    command: python -m app.api_main
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/app.db
      - VAULT_PATH=/data/vault
    volumes:
      - app_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  bot:
    build: ./backend
    command: python -m app.bot_main
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/app.db
      - VAULT_PATH=/data/vault
    volumes:
      - app_data:/data
    depends_on:
      - api
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # Syncthing: синхронизация папки /data/vault в твой Obsidian (на телефоне/компе).
  syncthing:
    image: syncthing/syncthing:latest
    hostname: dstu-pi
    environment:
      - PUID=0
      - PGID=0
    volumes:
      - app_data:/data
      - syncthing_config:/var/syncthing
    ports:
      - "8384:8384" # веб-интерфейс (LAN)
      - "22000:22000/tcp" # синхронизация
      - "22000:22000/udp"
      - "21027:21027/udp" # обнаружение в локальной сети
    restart: unless-stopped

  # Cloudflare Tunnel: публичный HTTPS на dstu.zazavpn.ru -> web:80.
  # Запуск только с профилем: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  # Том с SQLite-базой и Obsidian-хранилищем (/data/vault).
  app_data:
  # Конфиг Syncthing (ключи устройства).
  syncthing_config:
