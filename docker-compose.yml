services:
  api:
    build: ./backend
    command: python -m app.api_main
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/app.db
      - VAULT_PATH=/data/vault
    volumes:
      - app_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  bot:
    build: ./backend
    command: python -m app.bot_main
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/app.db
      - VAULT_PATH=/data/vault
    volumes:
      - app_data:/data
    depends_on:
      - api
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # Cloudflare Tunnel: публичный HTTPS на dstu.zazavpn.ru -> web:80.
  # Запуск только с профилем: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  # Том с SQLite-базой и Obsidian-хранилищем.
  # Папку /data/vault синхронизируй Syncthing'ом в свой Obsidian vault.
  app_data:
