services:
  api:
    build: ./backend
    command: python -m app.api_main
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/app.db
      - VAULT_PATH=/data/vault
    volumes:
      - app_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  bot:
    build: ./backend
    command: python -m app.bot_main
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/app.db
      - VAULT_PATH=/data/vault
    volumes:
      - app_data:/data
    depends_on:
      - api
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # Syncthing: синхронизация папки /data/vault в твой Obsidian (на телефоне/компе).
  syncthing:
    image: syncthing/syncthing:latest
    hostname: dstu-pi
    environment:
      - PUID=0
      - PGID=0
    volumes:
      - app_data:/data
      - syncthing_config:/var/syncthing
    ports:
      - "8384:8384" # веб-интерфейс (LAN)
      - "22000:22000/tcp" # синхронизация
      - "22000:22000/udp"
      - "21027:21027/udp" # обнаружение в локальной сети
    restart: unless-stopped

  # Caddy: авто-HTTPS (Let's Encrypt) напрямую, если у малинки есть входящий 80/443.
  # Запуск: docker compose --profile caddy up -d
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
    profiles: ["caddy"]

  # Cloudflare Tunnel: публичный HTTPS на dstu.zazavpn.ru -> web:80.
  # Конфиг и креды в ~/.cloudflared на хосте. Запуск: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - /home/kudesnik/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - web
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  # Том с SQLite-базой и Obsidian-хранилищем (/data/vault).
  app_data:
  # Конфиг Syncthing (ключи устройства).
  syncthing_config:
  # Сертификаты/состояние Caddy.
  caddy_data:
  caddy_config:
