server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA + хеш-роутинг
  location / {
    try_files $uri $uri/ /index.html;
  }

  # service worker без кеша, чтобы обновления прилетали сразу
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
